[package]
name = "payment-test-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
getrandom = "=0.3.4"
nix = { version = "=0.31.3", default-features = false, features = ["fs", "user"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = { version = "=1.8.2", default-features = false }
zcash_keys = { package = "zakura-keys", version = "=1.2.0", default-features = false, features = ["orchard"] }
zcash_protocol = { version = "=0.10.4", default-features = false, features = ["local-consensus", "std"] }
zip32 = { version = "=0.2.1", default-features = false }
