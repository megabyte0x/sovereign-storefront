name: ssf-public

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  logos-a:
    image: ssf-logos:arm64
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    logging: *logging
    volumes:
      - logos-a-data:/data
      - logos-ipc:/tmp
    ports:
      - "${PI_TAILNET_IP}:8091:8091"
    environment:
      QT_QPA_PLATFORM: offscreen
      LOGOS_LISTEN_PORT: "8091"
      LOGOS_DISC_PORT: "8090"
    healthcheck:
      test: ["CMD", "/opt/logos/squashfs-root/usr/bin/logosctl", "--config-dir", "/data", "--json", "daemon", "status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  delivery:
    image: ssf-delivery:arm64
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    logging: *logging
    profiles: ["wss"]
    tmpfs:
      - /tmp
    volumes:
      - delivery-data:/var/lib/ssf/delivery
    expose:
      - "8000"

  scanner:
    image: ssf-scanner:arm64
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    logging: *logging
    volumes:
      - scanner-state:/var/lib/ssf/scanner
      - ssf-run:/run/ssf
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/ssf/live/scanner.sock"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  seller:
    image: ssf-seller:arm64
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    logging: *logging
    depends_on:
      scanner:
        condition: service_healthy
      logos-a:
        condition: service_healthy
    environment:
      SSF_ENV_FILE: /etc/ssf/public-testnet.env
      SSF_REPLICA_AGENT_URL: http://${REPLICA_TAILNET_IP}:8790
      SSF_REPLICA_TOKEN_FILE: /var/lib/ssf/replica.token
      SSF_LOGOS_ADVERTISE_HOST: ${PI_TAILNET_IP}
    volumes:
      - seller-data:/var/lib/ssf
      - scanner-state:/var/lib/ssf/scanner
      - logos-a-data:/data
      - logos-ipc:/tmp
      - ssf-run:/run/ssf
      - /srv/ssf/public-testnet.env:/etc/ssf/public-testnet.env:ro
    expose:
      - "8787"
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared
    platform: linux/arm64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    logging: *logging
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "--no-autoupdate", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets:/etc/cloudflared/creds:ro
    tmpfs:
      - /tmp

volumes:
  logos-a-data:
  logos-ipc:
  delivery-data:
  scanner-state:
  ssf-run:
  seller-data:
